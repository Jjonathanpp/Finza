name: Publicar APK

# Arma la APK de Finza firmada con la clave de release y la publica en GitHub Releases (t-1.8.5).
# Se corre a mano: Actions → Publicar APK → Run workflow, sobre main. La versión la calcula solo:
# la siguiente a la última publicada, según "Tipo" (t-1.9.4). No hace falta subir "version:" en
# frontend/pubspec.yaml. Con "Solo probar" (marcado de entrada) arma la APK y la deja para bajar
# desde la corrida, sin publicar nada.
#
# Necesita, en Settings → Secrets and variables → Actions:
#   secrets   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   variable  ANDROID_CERT_SHA256 (en la pestaña Variables: la huella del certificado, para comprobar la firma)

on:
  workflow_dispatch:
    inputs:
      solo_probar:
        description: "Solo probar: armar la APK sin publicarla"
        type: boolean
        default: true
      tipo:
        description: "Versión nueva. Por ejemplo, desde la 1.1.3: arreglo da 1.1.4 y novedad, 1.2.0"
        type: choice
        options:
          - arreglo
          - novedad
        default: arreglo

permissions:
  contents: write

concurrency:
  group: publicar-apk
  cancel-in-progress: false

env:
  API_URL: https://finza-backend-9c6t.onrender.com
  FLUTTER_VERSION: 3.44.9

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # con los tags, para comparar con la última versión publicada

      - name: Publicar solo desde main
        if: ${{ !inputs.solo_probar && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Para publicar hay que correrlo sobre main."
          exit 1

      - name: Versión nueva
        id: version
        env:
          TIPO: ${{ inputs.tipo }}
        run: |
          # La siguiente a la última release publicada (t-1.9.4): pubspec.yaml no se lee.
          # Los tags viejos mezclan v y V (v1.0.0, V1.0.2): se comparan sin mirar mayúsculas.
          ultima=$(git tag | sed 's/^[vV]//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$ultima" ]; then
            echo "::error::No hay ninguna versión publicada de la cual partir."
            exit 1
          fi
          IFS=. read -r mayor menor arreglo <<< "$ultima"
          if [ "$TIPO" = "novedad" ]; then
            menor=$((menor + 1))
            arreglo=0
          else
            arreglo=$((arreglo + 1))
          fi
          version="$mayor.$menor.$arreglo"
          # Número interno de Android (versionCode): tiene que subir siempre para que el celular
          # acepte la actualización. Sale de la versión: 1.1.4 → 10104, 1.2.0 → 10200.
          codigo=$((mayor * 10000 + menor * 100 + arreglo))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "Última publicada: $ultima → nueva: $version (número interno $codigo)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finza-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/finza-release.jks" >> "$GITHUB_ENV"

      - name: Armar la APK (contra el backend de producción)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # APP_VERSION: la versión que la app compara con la última de GitHub para avisar que hay una nueva.
        # --build-name y --build-number pisan la versión de pubspec.yaml solo para esta APK.
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ steps.version.outputs.codigo }}
          --dart-define=API_URL=${{ env.API_URL }}
          --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Que esté firmada con la clave de Finza
        env:
          ESPERADA: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ -z "$ESPERADA" ]; then
            echo "::error::Falta la variable ANDROID_CERT_SHA256 (va en la pestaña Variables, no en Secrets)."
            exit 1
          fi
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          huella=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          esperada=$(echo "$ESPERADA" | tr -d ': ' | tr 'A-F' 'a-f')
          # Las huellas son públicas: se muestran para ver enseguida qué no coincide.
          echo "Huella de la APK:     $huella"
          echo "Huella de la clave:   $esperada"
          if [ "$huella" != "$esperada" ]; then
            echo "::error::La APK no quedó firmada con la clave de Finza: las huellas no coinciden."
            exit 1
          fi
          mv "$apk" "build/finza-${{ steps.version.outputs.version }}.apk"

      - name: Dejar la APK para bajar (solo probar)
        if: ${{ inputs.solo_probar }}
        uses: actions/upload-artifact@v7
        with:
          # Sin comprimir: se baja directo el .apk, que es lo que se instala.
          archive: false
          path: frontend/build/finza-${{ steps.version.outputs.version }}.apk
          retention-days: 7

      - name: Publicar en GitHub Releases
        if: ${{ !inputs.solo_probar }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/finza-$VERSION.apk" \
            --title "Finza $VERSION" --generate-notes --latest --target "$GITHUB_SHA"

      - name: Borrar la clave del runner
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/finza-release.jks"
