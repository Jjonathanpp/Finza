name: Publicar APK

# Arma la APK de Finza firmada con la clave de release y la publica en GitHub Releases (t-1.8.5).
# Se corre a mano: Actions → Publicar APK → Run workflow, sobre main. Antes, un PR tiene que subir
# "version:" en frontend/pubspec.yaml. Con "Solo probar" (marcado de entrada) arma la APK y la deja
# para bajar desde la corrida, sin publicar nada.
#
# Necesita, en Settings → Secrets and variables → Actions:
#   secrets   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   variable  ANDROID_CERT_SHA256 (la huella del certificado, para comprobar que la APK salió firmada con esa clave)

on:
  workflow_dispatch:
    inputs:
      solo_probar:
        description: "Solo probar: armar la APK sin publicarla"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-apk
  cancel-in-progress: false

env:
  API_URL: https://finza-backend-9c6t.onrender.com
  FLUTTER_VERSION: 3.44.9

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # con los tags, para comparar con la última versión publicada

      - name: Publicar solo desde main
        if: ${{ !inputs.solo_probar && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Para publicar hay que correrlo sobre main."
          exit 1

      - name: Versión de pubspec.yaml
        id: version
        run: |
          completa=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          version=${completa%%+*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión: $completa"
          # Los tags viejos mezclan v y V (v1.0.0, V1.0.2): se comparan sin mirar mayúsculas.
          if git tag | grep -qix "v$version"; then
            echo "::error::La versión $version ya está publicada. Subí version: en frontend/pubspec.yaml."
            exit 1
          fi
          ultima=$(git tag | sed 's/^[vV]//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$ultima" ] && [ "$(printf '%s\n%s\n' "$ultima" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::error::La versión $version no es mayor que la última publicada ($ultima)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finza-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/finza-release.jks" >> "$GITHUB_ENV"

      - name: Armar la APK (contra el backend de producción)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=API_URL=${{ env.API_URL }}

      - name: Que esté firmada con la clave de Finza
        env:
          ESPERADA: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          huella=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          esperada=$(echo "$ESPERADA" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$esperada" ] || [ "$huella" != "$esperada" ]; then
            echo "::error::La APK no quedó firmada con la clave de Finza (o falta la variable ANDROID_CERT_SHA256)."
            exit 1
          fi
          mv "$apk" "build/finza-${{ steps.version.outputs.version }}.apk"

      - name: Dejar la APK para bajar (solo probar)
        if: ${{ inputs.solo_probar }}
        uses: actions/upload-artifact@v4
        with:
          name: finza-${{ steps.version.outputs.version }}
          path: frontend/build/finza-${{ steps.version.outputs.version }}.apk
          retention-days: 7

      - name: Publicar en GitHub Releases
        if: ${{ !inputs.solo_probar }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/finza-$VERSION.apk" \
            --title "Finza $VERSION" --generate-notes --latest --target "$GITHUB_SHA"

      - name: Borrar la clave del runner
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/finza-release.jks"
