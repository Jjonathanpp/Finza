spring.flyway.enabled=true
# Estructura y catalogo (db/migration) y, solo en el Docker, los datos de prueba (T-1.10.2)
spring.flyway.locations=classpath:db/migration,classpath:db/datos-prueba

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:finza}
spring.datasource.username=${DB_USER:finza}
spring.datasource.password=${DB_PASS:finza}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Prende el atajo de autenticacion de los tests de Cucumber (header X-Test-Cuenta-Id en JwtAuthFilter).
# Solo aca: en produccion (perfil prod) la propiedad no existe y vale false, asi ese header no sirve.
app.auth-de-prueba=true
