spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:finza}
spring.datasource.username=${DB_USER:finza}
spring.datasource.password=${DB_PASS:finza}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Catalogo de categorias (t-1.8.2) y datos de prueba de import.sql (t-1.1.3)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:catalogo.sql,classpath:import.sql
spring.jpa.defer-datasource-initialization=true