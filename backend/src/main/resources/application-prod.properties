# Perfil de produccion (t-1.8.2). Render lo activa con SPRING_PROFILES_ACTIVE=prod.
# La conexion a la base llega por variables de entorno:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Solo el catalogo de categorias: sin usuarios ni movimientos de prueba
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:catalogo.sql
spring.jpa.defer-datasource-initialization=true

# Clave de cifrado de los tokens de Mercado Pago, sin valor por defecto:
# si falta MP_CRYPTO_SECRET, el backend no arranca
mp.crypto.secret=${MP_CRYPTO_SECRET}
