# Perfil de produccion (t-1.8.2). Render lo activa con SPRING_PROFILES_ACTIVE=prod.
# Render despliega solo cada merge a main, y solo si el CI queda en verde (T-1.9.3).
# Como se trabaja con el CI/CD y que hacer si un control falla: README, "Del cambio a produccion" (T-1.9.5).
# La conexion a la base llega por variables de entorno:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.jpa.hibernate.ddl-auto=validate

# La base de Render ya tiene las tablas (las creó Hibernate con update).
# Flyway la marca como V1 sin ejecutarla; en una base vacia si corre el V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Solo db/migration (el catalogo es la V3): los datos de prueba nunca llegan aca (T-1.10.2)

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Clave de cifrado de los tokens de Mercado Pago, sin valor por defecto:
# si falta MP_CRYPTO_SECRET, el backend no arranca
mp.crypto.secret=${MP_CRYPTO_SECRET}

# Brevo API para enviar correos electrónicos (t-8.2.1)
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=Finza

# Que Neon pueda dormirse aunque el backend esté despierto (T-1.8.7): el workflow "Mantener despierto"
# llama a /api/health cada 10 minutos, y ese endpoint no toca la base. Sin estas dos líneas el pool
# deja 10 conexiones abiertas con un control cada 2 minutos, Neon nunca se duerme y se queda sin horas
# gratis a fin de mes. Con ellas no hay conexiones de reserva y la que no se usa se cierra al minuto.
# Costo: ~1 s más en el primer pedido después de un rato sin uso (lo que tarda Neon en despertar).
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
