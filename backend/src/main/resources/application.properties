spring.application.name=demo
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=1800000
jwt.refresh-expiration-ms=604800000

# Mercado Pago OAuth
mercadopago.client-id=${MP_CLIENT_ID}
mercadopago.client-secret=${MP_CLIENT_SECRET}
mercadopago.redirect-uri=${MP_REDIRECT_URI}

# Gemini API
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
gemini.api.url.fallback=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
gemini.api.key=${GEMINI_API_KEY:dummy_key}

# Cotizaciones para ver los montos en dolares o euros (t-8.2.1). Sin clave
cotizaciones.api.url=https://dolarapi.com/v1

# Brevo API para enviar correos electrónicos (t-8.2.1)
brevo.api-key=${BREVO_API_KEY:mock_key}
brevo.sender-email=${BREVO_SENDER_EMAIL:no-reply@finza.local}
brevo.sender-name=Finza

app.invitaciones.base-url=finza://invitacion