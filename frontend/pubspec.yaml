name: frontend
description: "Finza - Frontend Flutter"
publish_to: "none"

# No se cambia a mano: cada APK sale con la versión que calcula "Publicar APK" a partir de la
# última release publicada (t-1.9.4). Esta solo se usa al correr la app en la compu.
version: 1.1.3+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  record: ^7.1.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.4.2
  record_web: ^2.1.3
  provider: ^6.1.5+1
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
