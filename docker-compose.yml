version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: finza-db
    environment:
      POSTGRES_DB: ${DB_NAME:-finza}
      POSTGRES_USER: ${DB_USER:-finza}
      POSTGRES_PASSWORD: ${DB_PASS:-finza}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finza} -d ${DB_NAME:-finza}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: finza-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-finza}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-finza}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-finza}
    depends_on:
      db:
        condition: service_healthy

  test:
    image: node:18-alpine
    container_name: finza-test
    working_dir: /app
    volumes:
      - ./testing:/app
    depends_on:
      - app
    command: sh -c "npm install && npm test"

volumes:
  postgres_data: